name: VixFlix Android CI & Versioned Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Versioned APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Compute Automatic Version on Check-in
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          RUN_NUM=${{ github.run_number }}
          TIMESTAMP_MIN=$(( $(date +%s) / 60 ))
          VERSION_CODE=${TIMESTAMP_MIN}
          VERSION_NAME="1.0.${RUN_NUM}"
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Building VixFlix v${VERSION_NAME} (code ${VERSION_CODE}, commit ${SHORT_SHA})"

      - name: Configure .env with TMDB_API_KEY
        env:
          SECRET_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$SECRET_TMDB_KEY" ]; then
            echo "TMDB_API_KEY=$SECRET_TMDB_KEY" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "TMDB_API_KEY=8bbf9bcc418b752d137d973fd97fcb0f" > .env
          fi

      - name: Prepare Persistent Signing Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            cat << 'EOF' | base64 -d > debug.keystore
          
          EOF
          fi

      - name: Build Versioned APK with Gradle
        env:
          CI_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CI_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gradle assembleDebug --no-configuration-cache --warning-mode=summary --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "VixFlix-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VixFlix-v${{ steps.version.outputs.version_name }}
          path: VixFlix-v${{ steps.version.outputs.version_name }}.apk

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "VixFlix v${{ steps.version.outputs.version_name }} (Build #${{ steps.version.outputs.version_code }})"
          body: |
            ### VixFlix Streaming Release v${{ steps.version.outputs.version_name }}
            - **Version Code:** `${{ steps.version.outputs.version_code }}`
            - **Commit:** `${{ steps.version.outputs.short_sha }}`
            - **Firma APK:** Persistente (`SHA1: 96:99:D9:34:15:C0:F4:69:1D:C9:C3:5D:8E:80:55:BF:63:73:BB:7C`)
            - **Changelog:** Compilazione automatica generata al check-in su `${{ github.ref_name }}`.
            - Scarica il file `VixFlix-v${{ steps.version.outputs.version_name }}.apk` allegato o aggiorna direttamente dall'app VixFlix!
          files: |
            VixFlix-v${{ steps.version.outputs.version_name }}.apk
          draft: false
          prerelease: false
